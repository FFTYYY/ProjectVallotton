# In-compose nginx: serves the built SPA and proxies the API to Django,
# streams protected media via X-Accel-Redirect.
# TLS is NOT handled here — the host nginx terminates HTTPS and proxies to
# this container (see deploy/host-nginx.conf.example).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # security headers (belt & suspenders; Django sets its own for API responses)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # ---------------- Django ----------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # forwarded from the host nginx (https); empty in plain-http dev
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }


    # No /admin/ here, on purpose. Django's own login page has none of the
    # rate limiting /api/auth/login has — no lock-out, no constant-time
    # compare — and bootstrap_users puts a superuser behind it with no
    # password floor. Reaching it is an SSH tunnel to 127.0.0.1:8300 away,
    # which for a single-person app is the right amount of effort.
    location /django-static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---------------- protected media (X-Accel-Redirect target) ----------------
    location /_protected_media/ {
        internal;
        alias /media/;
    }

    # ---------------- SPA ----------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # service worker / manifest must not be aggressively cached
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location / {
        try_files $uri /index.html;
    }
}
